<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contratos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main class="container py-4">
	<div th:replace="~{fragments/layout :: alertas}"></div>
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h4 class="mb-0"><i class="bi bi-file-earmark-text"></i> Contratos</h4>
		<a th:href="@{/contratos/nuevo}" class="btn btn-servitec"><i class="bi bi-plus-lg"></i> Nuevo contrato</a>
	</div>
	<div class="card border-0 shadow-sm">
		<div class="table-responsive">
			<table class="table table-hover mb-0 align-middle">
				<thead class="table-light">
					<tr><th>N°</th><th>Cliente</th><th>Registrado por</th><th>Inicio</th><th>Fin</th><th>Meses</th><th class="text-end">Mensual S/</th><th>Estado</th><th></th></tr>
				</thead>
				<tbody>
					<tr th:each="c : ${contratos}">
						<td th:text="${c.idContrato}"></td>
						<td th:text="${c.cliente.razonSocial}"></td>
						<td th:text="${c.usuario.username}"></td>
						<td th:text="${#temporals.format(c.fechaInicio, 'dd/MM/yyyy')}"></td>
						<td th:text="${#temporals.format(c.fechaFin, 'dd/MM/yyyy')}"></td>
						<td th:text="${c.meses}"></td>
						<td class="text-end" th:text="${#numbers.formatDecimal(c.montoMensual, 1, 'COMMA', 2, 'POINT')}"></td>
						<td><span class="badge" th:classappend="${c.estado == 'VIGENTE'} ? 'bg-success' : (${c.estado == 'ANULADO'} ? 'bg-danger' : 'bg-secondary')" th:text="${c.estado}"></span></td>
						<td><a th:href="@{/contratos/ver/{id}(id=${c.idContrato})}" class="btn btn-sm btn-outline-secondary">Ver detalle</a></td>
					</tr>
					<tr th:if="${#lists.isEmpty(contratos)}"><td colspan="9" class="text-center text-muted">Sin contratos registrados</td></tr>
				</tbody>
			</table>
		</div>
	</div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
