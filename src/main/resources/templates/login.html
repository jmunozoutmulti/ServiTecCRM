<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="login-fondo">
<main class="container">
	<div class="row justify-content-center align-items-center min-vh-100">
		<div class="col-md-5 col-lg-4">
			<div class="card shadow border-0">
				<div class="card-body p-4">
					<div class="text-center mb-4">
						<i class="bi bi-pc-display display-5 text-servitec"></i>
						<h4 class="fw-bold mt-2 mb-0">ServiTec CRM</h4>
						<small class="text-muted">Gestión de clientes y pagos mensuales</small>
					</div>
					<div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
					<div th:if="${param.salida}" class="alert alert-info py-2">Sesión cerrada correctamente</div>
					<form th:action="@{/login}" method="post">
						<div class="mb-3">
							<label class="form-label">Usuario</label>
							<input type="text" name="username" class="form-control" th:value="${username}" required autofocus>
						</div>
						<div class="mb-3">
							<label class="form-label">Contraseña</label>
							<input type="password" name="password" class="form-control" required>
						</div>
						<button type="submit" class="btn btn-servitec w-100">Ingresar</button>
					</form>
				</div>
			</div>
			<p class="text-center text-white-50 small mt-3">ServiTec Lima S.A.C. &copy; 2026</p>
		</div>
	</div>
</main>
</body>
</html>
