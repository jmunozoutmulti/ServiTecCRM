<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main class="container py-4">
	<div th:replace="~{fragments/layout :: alertas}"></div>
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h4 class="mb-0"><i class="bi bi-laptop"></i> Equipos y servicios</h4>
		<a th:href="@{/productos/nuevo}" class="btn btn-servitec"><i class="bi bi-plus-lg"></i> Nuevo producto</a>
	</div>
	<div class="card border-0 shadow-sm">
		<div class="table-responsive">
			<table class="table table-hover mb-0 align-middle">
				<thead class="table-light">
					<tr><th>Código</th><th>Nombre</th><th>Tipo</th><th>Marca</th><th class="text-end">Precio mensual S/</th><th class="text-center">Stock</th><th>Estado</th><th class="text-center">Acciones</th></tr>
				</thead>
				<tbody>
					<tr th:each="p : ${productos}">
						<td th:text="${p.codigo}"></td>
						<td th:text="${p.nombre}"></td>
						<td th:text="${p.tipo}"></td>
						<td th:text="${p.marca}"></td>
						<td class="text-end" th:text="${#numbers.formatDecimal(p.precioMensual, 1, 'COMMA', 2, 'POINT')}"></td>
						<td class="text-center" th:text="${p.esEquipo()} ? ${p.stock} : '-'"></td>
						<td><span class="badge" th:classappend="${p.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'" th:text="${p.estado}"></span></td>
						<td class="text-center text-nowrap">
							<a th:href="@{/productos/editar/{id}(id=${p.idProducto})}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil"></i></a>
							<a th:href="@{/productos/estado/{id}(id=${p.idProducto})}" class="btn btn-sm btn-outline-warning" title="Activar / desactivar"><i class="bi bi-arrow-repeat"></i></a>
							<a th:href="@{/productos/eliminar/{id}(id=${p.idProducto})}" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Eliminar este producto?')"><i class="bi bi-trash"></i></a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
