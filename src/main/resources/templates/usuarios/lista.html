<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main class="container py-4">
	<div th:replace="~{fragments/layout :: alertas}"></div>
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h4 class="mb-0"><i class="bi bi-person-badge"></i> Usuarios del sistema</h4>
		<a th:href="@{/usuarios/nuevo}" class="btn btn-servitec"><i class="bi bi-plus-lg"></i> Nuevo usuario</a>
	</div>
	<div class="card border-0 shadow-sm">
		<div class="table-responsive">
			<table class="table table-hover mb-0 align-middle">
				<thead class="table-light">
					<tr><th>Usuario</th><th>Nombre completo</th><th>Correo</th><th>Rol</th><th>Estado</th><th class="text-center">Acciones</th></tr>
				</thead>
				<tbody>
					<tr th:each="u : ${usuarios}">
						<td th:text="${u.username}"></td>
						<td th:text="${u.nombreCompleto}"></td>
						<td th:text="${u.correo}"></td>
						<td th:text="${u.rol.nombre}"></td>
						<td><span class="badge" th:classappend="${u.activo} ? 'bg-success' : 'bg-secondary'" th:text="${u.activo} ? 'ACTIVO' : 'INACTIVO'"></span></td>
						<td class="text-center text-nowrap">
							<a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil"></i></a>
							<a th:href="@{/usuarios/estado/{id}(id=${u.idUsuario})}" class="btn btn-sm btn-outline-warning" title="Activar / desactivar"><i class="bi bi-arrow-repeat"></i></a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
