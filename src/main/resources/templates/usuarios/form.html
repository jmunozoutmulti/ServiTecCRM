<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main class="container py-4">
	<div th:replace="~{fragments/layout :: alertas}"></div>
	<h4 class="mb-3" th:text="${usuario.idUsuario == null} ? 'Registrar usuario' : 'Editar usuario'"></h4>
	<div class="card border-0 shadow-sm">
		<div class="card-body">
			<form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="row g-3">
				<input type="hidden" th:field="*{idUsuario}">
				<div class="col-md-4">
					<label class="form-label">Usuario</label>
					<input type="text" th:field="*{username}" class="form-control" maxlength="30" required th:readonly="*{idUsuario != null}">
				</div>
				<div class="col-md-8">
					<label class="form-label">Nombre completo</label>
					<input type="text" th:field="*{nombreCompleto}" class="form-control" maxlength="100" required>
				</div>
				<div class="col-md-4">
					<label class="form-label">Correo</label>
					<input type="email" th:field="*{correo}" class="form-control" maxlength="100">
				</div>
				<div class="col-md-4">
					<label class="form-label">Rol</label>
					<select name="idRol" class="form-select" required>
						<option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombre}" th:selected="${usuario.rol != null and usuario.rol.idRol == r.idRol}"></option>
					</select>
				</div>
				<div class="col-md-4">
					<label class="form-label">Contraseña</label>
					<input type="password" name="clave" class="form-control" minlength="6" th:required="${usuario.idUsuario == null}">
					<small class="text-muted" th:if="${usuario.idUsuario != null}">Dejar vacío para mantener la actual</small>
				</div>
				<div class="col-12">
					<button type="submit" class="btn btn-servitec"><i class="bi bi-save"></i> Guardar</button>
					<a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
				</div>
			</form>
		</div>
	</div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
