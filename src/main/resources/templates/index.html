<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main class="container py-4">
	<h4 class="mb-4">Bienvenido(a), <span th:text="${usuarioSesion.nombreCompleto}"></span></h4>
	<div class="row g-3 mb-4">
		<div class="col-md-3">
			<div class="card tarjeta border-0 shadow-sm">
				<div class="card-body">
					<small class="text-muted">Clientes activos</small>
					<h3 class="fw-bold mb-0" th:text="${totalClientes}"></h3>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="card tarjeta border-0 shadow-sm">
				<div class="card-body">
					<small class="text-muted">Contratos vigentes</small>
					<h3 class="fw-bold mb-0" th:text="${contratosVigentes}"></h3>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="card tarjeta border-0 shadow-sm">
				<div class="card-body">
					<small class="text-muted">Total por cobrar</small>
					<h3 class="fw-bold mb-0" th:text="'S/ ' + ${#numbers.formatDecimal(totalPendiente, 1, 'COMMA', 2, 'POINT')}"></h3>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="card tarjeta border-0 shadow-sm border-danger">
				<div class="card-body">
					<small class="text-muted">Deuda vencida (<span th:text="${cuotasVencidas}"></span> cuotas)</small>
					<h3 class="fw-bold mb-0 text-danger" th:text="'S/ ' + ${#numbers.formatDecimal(totalVencido, 1, 'COMMA', 2, 'POINT')}"></h3>
				</div>
			</div>
		</div>
	</div>
	<div class="card border-0 shadow-sm">
		<div class="card-header bg-white d-flex justify-content-between align-items-center">
			<strong>Últimos contratos registrados</strong>
			<a th:href="@{/contratos/nuevo}" class="btn btn-servitec btn-sm"><i class="bi bi-plus-lg"></i> Nuevo contrato</a>
		</div>
		<div class="table-responsive">
			<table class="table table-hover mb-0 align-middle">
				<thead class="table-light">
					<tr><th>N°</th><th>Cliente</th><th>Inicio</th><th>Meses</th><th class="text-end">Mensual S/</th><th>Estado</th><th></th></tr>
				</thead>
				<tbody>
					<tr th:each="c : ${ultimosContratos}">
						<td th:text="${c.idContrato}"></td>
						<td th:text="${c.cliente.razonSocial}"></td>
						<td th:text="${#temporals.format(c.fechaInicio, 'dd/MM/yyyy')}"></td>
						<td th:text="${c.meses}"></td>
						<td class="text-end" th:text="${#numbers.formatDecimal(c.montoMensual, 1, 'COMMA', 2, 'POINT')}"></td>
						<td><span class="badge" th:classappend="${c.estado == 'VIGENTE'} ? 'bg-success' : 'bg-secondary'" th:text="${c.estado}"></span></td>
						<td><a th:href="@{/contratos/ver/{id}(id=${c.idContrato})}" class="btn btn-outline-secondary btn-sm">Ver</a></td>
					</tr>
					<tr th:if="${#lists.isEmpty(ultimosContratos)}"><td colspan="7" class="text-center text-muted">Sin contratos registrados</td></tr>
				</tbody>
			</table>
		</div>
	</div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
