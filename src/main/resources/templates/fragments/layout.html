<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${titulo} + ' | ServiTec CRM'">ServiTec CRM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-servitec shadow-sm">
	<div class="container">
		<a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-pc-display"></i> ServiTec CRM</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="menuPrincipal">
			<ul class="navbar-nav me-auto">
				<li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/contratos}">Contratos</a></li>
				<li class="nav-item dropdown">
					<a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Consultas</a>
					<ul class="dropdown-menu">
						<li><a class="dropdown-item" th:href="@{/consultas/estado-cuenta}">Estado de cuenta</a></li>
						<li><a class="dropdown-item" th:href="@{/consultas/cobranzas}">Cobranzas por fechas</a></li>
					</ul>
				</li>
				<th:block th:if="${usuarioSesion != null and usuarioSesion.esAdministrador()}">
					<li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/usuarios}">Usuarios</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/reportes}">Reportes</a></li>
				</th:block>
			</ul>
			<div class="d-flex align-items-center text-white" th:if="${usuarioSesion != null}">
				<span class="me-2"><i class="bi bi-person-circle"></i> <span th:text="${usuarioSesion.nombreCompleto}"></span></span>
				<span class="badge bg-light text-dark me-3" th:text="${usuarioSesion.rol.nombre}"></span>
				<a class="btn btn-outline-light btn-sm" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Salir</a>
			</div>
		</div>
	</div>
</nav>

<div th:fragment="alertas">
	<div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
		<i class="bi bi-check-circle"></i> <span th:text="${mensaje}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
	</div>
	<div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
		<i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
	</div>
</div>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
